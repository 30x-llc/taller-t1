<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de repaso · AI for Developers</title>
  <link rel="icon" href="marca/logo-30x.svg" type="image/svg+xml">
  <link rel="stylesheet" href="marca/marca.css">
  <style>
    /* Solo disposición; los colores salen de las variables de marca.css. */
    .encabezado-pregunta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .contador { font-size: 13px; color: var(--tenue); font-variant-numeric: tabular-nums; }
    .progreso { margin-bottom: 28px; }
    .progreso > span { transition: width .25s ease; }
    .enunciado { margin: 16px 0 20px; font-size: 22px; font-weight: 600; line-height: 1.3; color: var(--texto); }
    .opcion:disabled { cursor: default; }
    .opcion:disabled:not(.correcta):not(.incorrecta) { color: var(--tenue); }
    .explicacion { margin: 20px 0 0; padding-top: 20px; border-top: 1px solid var(--borde); color: var(--cuerpo); }
    .explicacion strong { color: var(--texto); }
    .acciones { display: flex; justify-content: flex-end; margin-top: 24px; }
    .puntaje { font-size: clamp(56px, 12vw, 96px); line-height: 1; margin: 8px 0 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="barra">
    <img src="marca/logo-30x.svg" alt="30X">
    <span>AI for Developers</span>
  </header>

  <main class="contenedor">
    <span class="eyebrow">Repaso N1 y N2</span>
    <h1 class="titulo">Quiz de repaso</h1>

    <section id="quiz" aria-live="polite">
      <div class="progreso" role="progressbar" aria-label="Progreso del quiz" aria-valuemin="0" aria-valuemax="100">
        <span id="barra-progreso" style="width: 0%"></span>
      </div>

      <article class="tarjeta">
        <div class="encabezado-pregunta">
          <span class="eyebrow" id="tema"></span>
          <span class="contador" id="contador"></span>
        </div>
        <h2 class="enunciado" id="pregunta"></h2>
        <div id="opciones"></div>
        <p class="explicacion" id="explicacion" hidden></p>
        <div class="acciones">
          <button type="button" class="boton" id="siguiente" hidden>Siguiente</button>
        </div>
      </article>
    </section>

    <section id="resultado" hidden>
      <article class="tarjeta">
        <span class="eyebrow">Resultado</span>
        <p class="puntaje"><span class="cifra" id="puntaje"></span></p>
        <p class="cuerpo" id="mensaje-final"></p>
        <div class="acciones">
          <button type="button" class="boton" id="reiniciar">Jugar de nuevo</button>
        </div>
      </article>
    </section>
  </main>

  <script src="preguntas.js"></script>
  <script src="app.js"></script>
</body>
</html>
