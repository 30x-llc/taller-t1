<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de repaso · AI for Developers</title>
  <link rel="stylesheet" href="marca/marca.css">
  <style>
    .encabezado { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .contador { font-size: 13px; color: var(--tenue); font-variant-numeric: tabular-nums; }
    .progreso { margin-bottom: 28px; }
    .progreso > span { width: 0; transition: width .25s ease; }
    .enunciado { margin: 0 0 18px; font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; color: var(--texto); }
    .opcion:disabled { cursor: default; }
    .opcion:disabled:not(.correcta):not(.incorrecta) { color: var(--tenue); }
    .opcion:disabled:hover:not(.correcta):not(.incorrecta) { border-color: var(--borde-fuerte); }
    .explicacion { margin: 18px 0 0; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta-2); color: var(--cuerpo); }
    .explicacion strong { color: var(--texto); }
    .acciones { display: flex; justify-content: flex-end; margin-top: 24px; }
    .resultado .cifra { font-size: clamp(56px, 12vw, 96px); line-height: 1; letter-spacing: -.03em; }
    .resultado .cuerpo { margin: 12px 0 28px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="barra">
    <img src="marca/logo-30x.svg" alt="30X">
    <span>AI for Developers</span>
  </header>

  <main class="contenedor">
    <span class="eyebrow">Repaso N1, N2 y Taller</span>
    <h1 class="titulo">Quiz de repaso</h1>

    <section id="quiz" class="tarjeta" aria-live="polite">
      <div class="encabezado">
        <span id="tema" class="eyebrow"></span>
        <span id="contador" class="contador"></span>
      </div>
      <div class="progreso" role="progressbar" aria-label="Progreso del quiz" aria-valuemin="0" id="barra-progreso">
        <span id="relleno"></span>
      </div>
      <h2 id="pregunta" class="enunciado"></h2>
      <div id="opciones"></div>
      <p id="explicacion" class="explicacion" hidden></p>
      <div class="acciones">
        <button id="siguiente" class="boton" type="button" hidden>Siguiente</button>
      </div>
    </section>

    <section id="resultado" class="tarjeta resultado" hidden aria-live="polite">
      <span class="eyebrow">Tu puntaje</span>
      <p style="margin: 16px 0 0;"><span id="puntaje" class="cifra"></span></p>
      <p id="mensaje" class="cuerpo"></p>
      <button id="reiniciar" class="boton" type="button">Jugar de nuevo</button>
    </section>
  </main>

  <script src="preguntas.js"></script>
  <script src="app.js"></script>
</body>
</html>
